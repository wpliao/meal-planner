name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Cloudflare environment to deploy
        type: choice
        required: true
        options:
          - development
          - production
      production_confirmation:
        description: Type DEPLOY_PRODUCTION when selecting production
        type: string
        required: false

permissions:
  contents: read
  # Read CI's result for the deployed commit (scripts/ci-verified.sh).
  actions: read

# Shared with household-decommission.yml: a deploy must never overlap a
# household decommission of the same environment.
concurrency:
  group: cloudflare-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate-production-intent:
    name: Validate production intent
    if: inputs.environment == 'production'
    runs-on: ubuntu-24.04
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.production_confirmation }}
        run: test "$CONFIRMATION" = "DEPLOY_PRODUCTION"

  deploy-development:
    name: Deploy development
    if: inputs.environment == 'development'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: development
    env:
      CI: true
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # CI's push run for this commit already ran every check; reuse it, or
      # run the full gate here when it is missing, failed, or still running
      # after 20 minutes.
      - name: Reuse CI verification of this commit
        id: ci
        run: ./scripts/ci-verified.sh "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          CI_VERIFIED_TIMEOUT_SECONDS: 1200
      - name: Install test browsers for the full gate
        if: steps.ci.outputs.verified != 'true'
        run: pnpm run setup:browsers
      - name: Run the full gate
        if: steps.ci.outputs.verified != 'true'
        run: ./scripts/verify.sh
      - name: Build development configuration
        run: pnpm build
        env:
          CLOUDFLARE_ENV: development
      - name: Apply development D1 migrations
        run: pnpm wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_ENV: development
      # The committed USDA reference data (ADR 0009), loaded only when the
      # database doesn't already hold this exact file. It verifies itself and
      # fails the deploy, before the Worker is published, if the load is
      # incomplete.
      - name: Load development nutrition reference data
        run: node scripts/nutrition-dataset-load.ts --remote
        env:
          CLOUDFLARE_ENV: development
      - name: Deploy development
        run: pnpm wrangler deploy
        env:
          CLOUDFLARE_ENV: development

  deploy-production:
    name: Deploy production
    if: inputs.environment == 'production'
    needs: validate-production-intent
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    env:
      CI: true
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # CI's push run for this commit already ran every check; reuse it, or
      # run the full gate here when it is missing, failed, or still running
      # after 20 minutes.
      - name: Reuse CI verification of this commit
        id: ci
        run: ./scripts/ci-verified.sh "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          CI_VERIFIED_TIMEOUT_SECONDS: 1200
      - name: Install test browsers for the full gate
        if: steps.ci.outputs.verified != 'true'
        run: pnpm run setup:browsers
      - name: Run the full gate
        if: steps.ci.outputs.verified != 'true'
        run: ./scripts/verify.sh
      - name: Build production configuration
        run: pnpm build
        env:
          CLOUDFLARE_ENV: production
      - name: Apply production D1 migrations
        run: pnpm wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_ENV: production
      # The committed USDA reference data (ADR 0009), loaded only when the
      # database doesn't already hold this exact file. It verifies itself and
      # fails the deploy, before the Worker is published, if the load is
      # incomplete.
      - name: Load production nutrition reference data
        run: node scripts/nutrition-dataset-load.ts --remote
        env:
          CLOUDFLARE_ENV: production
      - name: Deploy production
        run: pnpm wrangler deploy
        env:
          CLOUDFLARE_ENV: production
